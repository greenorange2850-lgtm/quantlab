services:
  - type: web
    name: quantlab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: SERVE_STATIC
        value: "1"
      - key: DB_PATH
        value: /app/data/trading-os.db
